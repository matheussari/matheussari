<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="End of transmission" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8c64e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a8c64e" stop-opacity="1"/>
      <stop offset="1" stop-color="#a8c64e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="70" rx="8" fill="#07090c"/>
  <line x1="40" y1="22" x2="960" y2="22" stroke="#131a22" stroke-width="2"/>
  <rect x="40" y="21" width="160" height="3" fill="url(#beam)">
    <animate attributeName="x" values="40;800;40" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="500.0" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="4" fill="#6e7681" text-anchor="middle">// END OF TRANSMISSION<tspan fill="#a8c64e"> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
</svg>